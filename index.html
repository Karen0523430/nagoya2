                    { time: "10:00-11:30", title: "逛街採購：GU / Uniqlo / 大創", desc: "營業時間皆為 10:00-20:00", category: "shopping", maps: [
                        { name: "大創 DAISO", url: "https://maps.app.goo.gl/mjq5r6GRdbzTJ2D68" },
                        { name: "GU", url: "https://maps.app.goo.gl/Bbjs6ExgMjr1iAw7A" },
                        { name: "Uniqlo", url: "https://maps.app.goo.gl/9ZkjFrmVa1M8SVW9" }
                    ] },
                    { time: "11:30-12:30", title: "寶可夢中心 名古屋店", desc: "Pokemon Center，營業時間 10:00-20:00", category: "shopping", maps: [{ name: "寶可夢中心 名古屋", url: "https://maps.app.goo.gl/ttR3mDc7mP1JX92V8" }] },
                    { time: "12:30", title: "午餐：鰻櫃 花岡 (鰻魚飯三吃)", desc: "預計 12:30 享用名物鰻魚飯", category: "food", maps: [{ name: "鰻櫃 花岡", url: "https://maps.app.goo.gl/zXSrFBXRd4afnStR7" }] },
                    { time: "13:00-13:30", title: "茅乃舍 松坂屋名古屋店", desc: "購買優質高湯包、高湯醬油", category: "shopping", maps: [{ name: "茅乃舍", url: "https://maps.app.goo.gl/voJ5yCDFtM6WUzzj7" }] },
                    { time: "13:30-", title: "PARCO 名古屋 西館", desc: "買 HOKA 運動鞋及潮牌服飾", category: "shopping", maps: [{ name: "PARCO 名古屋", url: "https://maps.app.goo.gl/S3Z7OxGXqPDp1dHu6" }] },
                    { time: "18:00", title: "Alpen NAGOYA", desc: "大型戶外運動用品旗艦店 (營業至21:00)", category: "shopping", maps: [{ name: "Alpen NAGOYA", url: "https://maps.app.goo.gl/gQNZpTcYmmK6MCfJ9" }] },
                    { time: "19:00", title: "Amica Osu 批發超市", desc: "把握 8 點關門前最後補貨", category: "shopping", maps: [{ name: "Amica Osu", url: "https://maps.app.goo.gl/NCzeNFDJEapHp6iw6" }] },
                    { time: "晚餐", title: "晚餐：世界的山將 (Sekai no Yamachan)", desc: "必吃招牌夢幻手羽先(炸雞翅) 榮店", category: "food", maps: [{ name: "世界的山將 榮店", url: "https://maps.app.goo.gl/aoC5PD6x1XfdTCdZ7" }] },
                    { time: "回飯店", title: "回飯店休息", desc: "住：名古屋榮弗爾札飯店", category: "hotel", maps: [{ name: "名古屋榮弗爾札飯店", url: "https://maps.app.goo.gl/re1B2d5EfnaPbrZ18" }] }
                ]
            },
            {
                date: "1/29",
                dayOfWeek: "(五)",
                title: "1/29 (五) 科學館極寒體驗 ➔ 機場前夜",
                subtitle: "名古屋市科學館、BicCamera電器大採購",
                highlight: false,
                items: [
                    { time: "09:00", title: "退房出門", desc: "整理行李辦理退房手續", category: "hotel" },
                    { time: "09:00-10:00", title: "早餐：Okage庵 榮廣小路店", desc: "客美多(Komeda)旗下日式甘味處早餐", category: "food" },
                    { time: "10:00-15:00", title: "名古屋市科學館", desc: "預計停留5小時！買完票先直接到五樓抽取『極寒Lab』整理券", category: "spot", maps: [{ name: "名古屋市科學館", url: "https://maps.app.goo.gl/TmgVaLg2PQn5C6W48" }] },
                    { time: "15:00-16:30", title: "BicCamera 電器買物", desc: "採買日本最新熱門家電", category: "shopping", maps: [{ name: "BicCamera", url: "https://maps.app.goo.gl/gtFyZaFzWEG9867s6" }] },
                    { time: "傍晚", title: "吃午晚餐", desc: "品嚐市區特色美食", category: "food" },
                    { time: "17:00", title: "回飯店拿行李 ➔ 往機場移動", desc: "返回名古屋榮弗爾札飯店拿寄放的行李，搭車前往機場（車程抓1小時）", category: "transport", maps: [{ name: "飯店取行李", url: "https://maps.app.goo.gl/re1B2d5EfnaPbrZ18" }] },
                    { time: "晚上", title: "入住機場飯店", desc: "入住 東橫INN 1號店（便於隔日搭機）", category: "hotel", maps: [{ name: "東橫INN 1號店", url: "https://maps.app.goo.gl/48HV18CzQnrez8cf6" }] }
                ]
            },
            {
                date: "1/30",
                dayOfWeek: "(六)",
                title: "1/30 (六) 滿載而歸 ➔ 飛回台灣",
                subtitle: "名古屋中部國際機場 ➔ 桃園國際機場",
                highlight: false,
                items: [
                    { time: "07:00", title: "退房", desc: "飯店有附早餐，吃飽後退房", category: "hotel" },
                    { time: "07:30", title: "機場 Check in", desc: "辦理登機手續與行李託運", category: "transport" },
                    { time: "09:50-12:15", title: "飛行返台 (JP 09:50 ➔ TW 12:15)", desc: "中華航空航班，吃飛機餐，順利抵達桃園機場", category: "transport" }
                ]
            }
        ];

        // State Management
        let currentDayIndex = 0;
        let searchQuery = "";

        // DOM Elements
        const dayTabsContainer = document.getElementById('dayTabs');
        const scheduleContainer = document.getElementById('scheduleContainer');
        const dayTag = document.getElementById('dayTag');
        const dayTitle = document.getElementById('dayTitle');
        const daySubtitle = document.getElementById('daySubtitle');
        const dayCountNum = document.getElementById('dayCountNum');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const searchResultsNotice = document.getElementById('searchResultsNotice');
        const searchResultCount = document.getElementById('searchResultCount');
        const resetSearchBtn = document.getElementById('resetSearchBtn');

        // Helper to get category icons & styles
        function getCategoryStyle(category) {
            switch(category) {
                case 'food':
                    return { icon: 'fa-utensils', bg: 'bg-amber-100', text: 'text-amber-700', label: '美食' };
                case 'spot':
                    return { icon: 'fa-camera-retro', bg: 'bg-emerald-100', text: 'text-emerald-700', label: '景點' };
                case 'shopping':
                    return { icon: 'fa-bag-shopping', bg: 'bg-purple-100', text: 'text-purple-700', label: '購物' };
                case 'hotel':
                    return { icon: 'fa-bed', bg: 'bg-rose-100', text: 'text-rose-700', label: '住宿' };
                case 'transport':
                default:
                    return { icon: 'fa-bus', bg: 'bg-sky-100', text: 'text-sky-700', label: '交通/流程' };
            }
        }

        // Render Day Tabs
        function renderTabs() {
            dayTabsContainer.innerHTML = itineraryData.map((day, idx) => {
                const isActive = (idx === currentDayIndex && !searchQuery);
                return `
                    <button onclick="switchDay(${idx})" 
                            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition duration-200 flex items-center gap-1.5 ${
                                isActive 
                                    ? 'bg-sky-600 text-white shadow-md shadow-sky-200 font-semibold' 
                                    : 'bg-white text-slate-600 hover:bg-slate-200/60 border border-slate-200'
                            }">
                        <span>${day.date} ${day.dayOfWeek}</span>
                        ${day.highlight ? '<span class="w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
                    </button>
                `;
            }).join('');
        }

        // Render Header Banner for Selected Day
        function renderHeader() {
            const day = itineraryData[currentDayIndex];
            dayTag.innerText = `Day ${currentDayIndex + 1}`;
            dayTitle.innerText = day.title;
            daySubtitle.innerHTML = `<i class="fa-regular fa-clock text-xs"></i> ${day.subtitle}`;
            dayCountNum.innerText = (currentDayIndex + 1).toString().padStart(2, '0');
        }

        // Render Schedule Items
        function renderSchedule() {
            scheduleContainer.innerHTML = '';

            let itemsToDisplay = [];

            if (searchQuery) {
                // Global Search mode
                searchResultsNotice.classList.remove('hidden');
                itineraryData.forEach((day, dIdx) => {
                    day.items.forEach(item => {
                        const matchTitle = item.title.toLowerCase().includes(searchQuery.toLowerCase());
                        const matchDesc = item.desc.toLowerCase().includes(searchQuery.toLowerCase());
                        const matchTime = item.time.toLowerCase().includes(searchQuery.toLowerCase());
                        if (matchTitle || matchDesc || matchTime) {
                            itemsToDisplay.push({ ...item, dayDate: day.date, dayTitle: day.title, dayIdx: dIdx });
                        }
                    });
                });
                searchResultCount.innerText = itemsToDisplay.length;
            } else {
                // Day mode
                searchResultsNotice.classList.add('hidden');
                itemsToDisplay = itineraryData[currentDayIndex].items;
            }

            if (itemsToDisplay.length === 0) {
                scheduleContainer.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
                        <i class="fa-solid fa-magnifying-glass text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-600 font-medium">找不到與「${searchQuery}」相關的行程</p>
                        <p class="text-xs text-slate-400 mt-1">請嘗試搜尋關鍵字如：合掌村、拉麵、名古屋、壽司</p>
                    </div>
                `;
                return;
            }

            itemsToDisplay.forEach((item, index) => {
                const style = getCategoryStyle(item.category);
                
                // Map links HTML
                let mapsHtml = '';
                if (item.maps && item.maps.length > 0) {
                    mapsHtml = `
                        <div class="mt-3 pt-2.5 border-t border-slate-100 flex flex-wrap gap-2">
                            ${item.maps.map(m => `
                                <a href="${m.url}" target="_blank" rel="noopener noreferrer" 
                                   class="inline-flex items-center gap-1.5 px-3 py-1 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200/80 rounded-lg text-xs font-medium transition duration-150">
                                    <i class="fa-solid fa-location-dot text-rose-500"></i>
                                    <span>${m.name}</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-sky-400 ml-0.5"></i>
                                </a>
                            `).join('')}
                        </div>
                    `;
                }

                // Date badge for search results mode
                let searchDayBadge = '';
                if (searchQuery) {
                    searchDayBadge = `<span class="mb-1 inline-block text-[11px] font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${item.dayDate} - ${item.dayTitle}</span>`;
                }

                const cardHtml = `
                    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:shadow-md transition duration-200 relative overflow-hidden">
                        ${searchDayBadge}
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 text-slate-700 font-mono tracking-tight">
                                    ${item.time}
                                </span>
                                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${style.bg} ${style.text}">
                                    <i class="fa-solid ${style.icon} text-[10px]"></i>
                                    ${style.label}
                                </span>
                            </div>
                        </div>

                        <h3 class="text-base font-bold text-slate-800 mt-2.5 flex items-center gap-2">
                            ${item.title}
                        </h3>

                        ${item.desc ? `<p class="text-sm text-slate-600 mt-1.5 leading-relaxed">${item.desc}</p>` : ''}

                        ${mapsHtml}
                    </div>
                `;

                scheduleContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Switch Day Handler
        function switchDay(index) {
            currentDayIndex = index;
            searchQuery = "";
            searchInput.value = "";
            clearSearchBtn.classList.add('hidden');
            renderTabs();
            renderHeader();
            renderSchedule();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Search Input Handlers
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            if (searchQuery) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderTabs();
            renderSchedule();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = "";
            searchQuery = "";
            clearSearchBtn.classList.add('hidden');
            renderTabs();
            renderSchedule();
        });

        resetSearchBtn.addEventListener('click', () => {
            searchInput.value = "";
            searchQuery = "";
            clearSearchBtn.classList.add('hidden');
            renderTabs();
            renderSchedule();
        });

        // Initialize App
        function init() {
            renderTabs();
            renderHeader();
            renderSchedule();
        }

        init();
    </script>
</body>
</html>
